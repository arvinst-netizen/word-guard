name: 生成发音
on:
  # 游戏加了新词、改了例句（部署时会更新 audio/texts.json），自动补生成新增的录音
  push:
    branches: [main]
    paths: ['audio/texts.json']
  workflow_dispatch:
    inputs:
      mode:
        description: 'sample = 生成试听页挑声音；full = 生成全部单词和例句'
        required: true
        default: sample
        type: choice
        options: [sample, full]
      voice:
        description: '声音名字（full 模式用），例如 en-US-Chirp3-HD-Leda'
        required: false
        default: en-US-Chirp3-HD-Leda
      rate:
        description: '语速，1 是正常，0.9 稍慢'
        required: false
        default: '1.0'
permissions:
  contents: write
concurrency: tts
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: 生成
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          # 自动触发时没有输入，用正式选定的声音和语速（改这里要和手动生成时一致，否则会全部重新生成）
          MODE: ${{ inputs.mode || 'full' }}
          VOICE: ${{ inputs.voice || 'en-US-Chirp3-HD-Leda' }}
          RATE: ${{ inputs.rate || '1.0' }}
        run: python3 tools/tts.py
      - name: 提交音频
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add audio
          git diff --cached --quiet && echo "没有变化" && exit 0
          git commit -m "生成发音（${{ inputs.mode || 'full' }} ${{ inputs.voice || 'en-US-Chirp3-HD-Leda' }}）"
          git pull --rebase
          git push

name: 生成插画
on:
  # Claude 推送 art/run.json 就会运行（内容如 {"mode": "sample", "redo": "", "n": 1}）
  push:
    paths: ['art/run.json']
  # 自动续画：每 6 小时看一次，art/autopilot.json 打开、上一轮还没画完（status 是 more）就接着画
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = 免费检查密钥和模型；sample = 规划并画 16 个词看画风和递进；plan = 只写画面描述；full = 规划并画完全部（可中断，再跑接着画）；redo = 重画指定的'
        required: true
        default: sample
        type: choice
        options: [check, sample, plan, full, redo]
      redo:
        description: 'redo 模式：要重画的，用逗号分隔；"run" 重画这个词所有阶段，"run@ket" 只重画 KET 阶段'
        required: false
        default: ''
      budget:
        description: '花费上限（美元，累计），到了就停'
        required: false
        default: '250'
permissions:
  contents: write
concurrency: art
jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Pillow
        run: pip install pillow
      - name: 生成并分批提交
        env:
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          IN_MODE: ${{ inputs.mode }}
          IN_REDO: ${{ inputs.redo }}
          IN_BUDGET: ${{ inputs.budget }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.event_name }}" = schedule ]; then
            go=$(python3 -c "import json,os;a=json.load(open('art/autopilot.json')) if os.path.exists('art/autopilot.json') else {};s=json.load(open('art/status.json')) if os.path.exists('art/status.json') else {};print('yes' if a.get('enabled') and s.get('result')=='more' else 'no')")
            if [ "$go" != yes ]; then echo "自动续画没打开或已画完，不用跑"; exit 0; fi
            cp art/autopilot.json art/run.json
          fi
          if [ "${{ github.event_name }}" != workflow_dispatch ]; then
            eval "$(python3 -c "import json,shlex;r=json.load(open('art/run.json'));print('export MODE='+shlex.quote(r.get('mode','sample')),'REDO='+shlex.quote(r.get('redo','')),'BUDGET='+shlex.quote(str(r.get('budget',250))),'RUN_PROJECT='+shlex.quote(str(r.get('project',''))),'LIMIT='+shlex.quote(str(r.get('limit',150))),'ROUNDS='+shlex.quote(str(r.get('rounds',60))),'THINKING='+shlex.quote(str(r.get('thinking',''))))")"
          else
            export MODE="$IN_MODE" REDO="$IN_REDO" BUDGET="$IN_BUDGET"
          fi
          # 项目号不是机密：Secrets 里没有 GCP_PROJECT 时用 run.json 里的（走 global 端点，价格最低、Nano Banana 2.1 只在 global）
          if [ -z "$GCP_PROJECT" ] && [ -n "$RUN_PROJECT" ]; then export GCP_PROJECT="$RUN_PROJECT"; fi
          echo "模式 $MODE，上限 \$$BUDGET"
          commit() {
            git add art
            git diff --cached --quiet && return 0
            git commit -q -m "插画：$MODE $(python3 -c "import json;s=json.load(open('art/status.json'));print(s.get('result',''),s.get('drawn',''),'张','\$'+str(s.get('spend','')))" 2>/dev/null)"
            for i in 1 2 3; do git pull -q --rebase && git push -q && return 0; sleep 5; done
          }
          code=0
          for round in $(seq 1 ${ROUNDS:-60}); do
            set +e; timeout 90m python3 tools/art.py; code=$?; set -e
            commit
            if [ "$code" != 10 ]; then break; fi
            if [ "$round" -ge "${ROUNDS:-60}" ]; then code=0; break; fi
            # 一个任务最多跑 6 小时：5 小时后停下，status.json 里 result=more，再推送 run.json 接着画
            if [ $SECONDS -gt 18000 ]; then echo "时间快到，先停在这里"; code=0; break; fi
            echo "第 $round 轮完成，接着画"
          done
          exit $code

name: 生成插画
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'sample = 先规划并画 16 个词看画风和递进；plan = 只写画面描述（便宜，可先审）；full = 规划并画完全部（可中断，再跑接着画）；redo = 重画指定的'
        required: true
        default: sample
        type: choice
        options: [sample, plan, full, redo]
      redo:
        description: 'redo 模式：要重画的，用逗号分隔；"run" 重画这个词所有阶段，"run@ket" 只重画 KET 阶段'
        required: false
        default: ''
      model:
        description: 'Vertex AI 图像模型'
        required: false
        default: gemini-3.1-flash-image
      planner:
        description: '写画面描述的文字模型（留空自动选可用的）'
        required: false
        default: ''
      size:
        description: '生成尺寸 512 / 1K（游戏里用 256，512 足够也更便宜）'
        required: false
        default: '512'
permissions:
  contents: write
concurrency: art
jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Pillow
        run: pip install pillow
      - name: 生成并分批提交
        env:
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          MODE: ${{ inputs.mode }}
          REDO: ${{ inputs.redo }}
          MODEL: ${{ inputs.model }}
          SIZE: ${{ inputs.size }}
          PLANNER: ${{ inputs.planner }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          commit() {
            git add art
            git diff --cached --quiet && return 0
            git commit -q -m "生成插画（${MODE} ${MODEL}）"
            git pull -q --rebase && git push -q
          }
          for round in $(seq 1 30); do
            set +e; python3 tools/art.py; code=$?; set -e
            commit
            if [ "$code" = 10 ]; then echo "第 $round 轮完成，接着画"; continue; fi
            exit $code
          done
